[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  HOC_VUI_PROGRESS_BOARD_ENABLED = "true"

[dev]
  command = "npm run dev -- --host 127.0.0.1 --port 4173"
  targetPort = 4173
  port = 8888
  framework = "vite"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
