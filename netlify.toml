[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  HOC_VUI_PROGRESS_BOARD_ENABLED = "true"

# Local final-review environment; production rollout remains separately configured.
[context.dev.environment]
  HOC_VUI_CHALLENGE_MODE = "on"
  HOC_VUI_PROGRESS_BOARD_ENABLED = "true"
  VITE_API_BASE_URL = ""

[dev]
  command = "npm run preview -- --host 127.0.0.1 --port 4173 --strictPort"
  targetPort = 4173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
